<p>这期视频把蛋白质安排的重点放在全天摄入量。讲解者建议按训练强度与日常消耗选择，给出的范围是每天每公斤体重1.2至2.0克，对多数爱好者更推荐约1.6克。他认为先补足总量，比纠结分成多少顿更重要。</p>
<p>食物来源可以在肉、鸡蛋和牛奶之间选择，植物蛋白也可使用，视频建议交替搭配。乳清蛋白粉是片中为了方便而介绍的补充选项；所展示产品一勺约20克蛋白质，是该产品的份量说明。</p>
