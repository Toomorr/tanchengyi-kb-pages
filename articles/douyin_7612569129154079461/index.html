<p>这段视频从高强度训练后的疲劳谈到恢复。作者提醒，练得多并不代表恢复已经到位，睡眠和营养同样需要关注，身体在训练后也需要时间调整。他把谷氨酰胺列为自己使用的补剂之一，这次分享主要围绕个人补充经历展开。</p>
<p>作者记录自己平时每天补充5克，备赛前期改为10克，并说后期可能用到15克。这里的剂量是他的个人安排，后期增加也只是当时的计划。后半段介绍赞助品牌、口味和抽奖，视频没有提供依据训练强度、身体状况来决定补充量的完整方法。</p>
