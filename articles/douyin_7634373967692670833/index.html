<nav class="reading-modes" aria-label="阅读方式"><span aria-current="page">文章版</span> · <a href="../../videos/douyin_7634373967692670833/">图文讲义</a> · <a href="../../articles/">文章目录</a></nav>
<p>视频在卧推或夹胸时肩胸交界不舒服的语境里，示范了坐姿夹胸的一个变化。身体稍微前倾，胸背离开靠垫、维持悬空，再完成夹胸，让肩胛与手臂一起活动。与完全靠住的版本相比，作者希望借这个动作增加身体联动。</p>
<p>片中把这种变式用于激活，也允许作为正式动作；先做几组，再看是否继续原来的孤立训练。如果孤立训练已经让肩部压力很大，作者建议减少这类训练，多用能让身体一起参与的方式。本期没有在口播中规定重量、次数或统一组数。</p>
